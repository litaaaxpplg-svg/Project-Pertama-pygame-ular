<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Snake Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================= HOME ================= -->
    <div id="home" class="halaman">
        <div class="awan awan1"></div>
        <div class="awan awan2"></div>

        <div class="dekorasi pink"></div>
        <div class="dekorasi biru"></div>
        <div class="dekorasi hijau"></div>
        <div class="dekorasi ungu"></div>

        <h1>SNAKE</h1>
        <h2>Cute Snake Adventure</h2>

        <!-- Ular di halaman utama -->
        <div class="ular-home">
            <span class="badan ungu"></span>
            <span class="badan pink"></span>
            <span class="badan orange"></span>
            <span class="badan kuning"></span>
            <span class="badan hijau"></span>
            <span class="kepala"></span>
        </div>

        <button id="mulai">MULAI GAME</button>
        <button id="keluar">KELUAR</button>

        <p class="petunjuk">WASD • PANAH • TOMBOL LAYAR</p>
    </div>

    <!-- ================= GAME ================= -->
    <div id="game" class="halaman" style="display: none;">

        <canvas id="canvas"></canvas>

        <div id="skor">SKOR 0</div>

        <!-- Tombol kontrol -->
        <div class="kontrol">
            <button id="atas">↑</button>

            <div>
                <button id="kiri">←</button>
                <button id="bawah">↓</button>
                <button id="kanan">→</button>
            </div>
        </div>

        <!-- Game Over -->
        <div id="gameOver" class="game-over" style="display: none;">
            <div class="panel-gameover">
                <h2>GAME OVER</h2>

                <div class="garis"></div>

                <h3 id="skorAkhir">SKOR AKHIR : 0</h3>

                <p>R • Main Lagi</p>
                <p>ESC • Halaman Utama</p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
